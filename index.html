<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agentra - Ai Agency React Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- fonts + icons -->
    <link rel="stylesheet" href="/assets/font/fonts.css" />
    <link rel="stylesheet" href="/assets/icons/icomoon/style.css" />
    <!-- vendor css -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="/assets/css/animate.min.css" />
    <link rel="stylesheet" href="/assets/css/odometer.min.css" />
    <link rel="stylesheet" href="/assets/css/nice-select.css" />
    <!-- theme css -->
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <link rel="shortcut icon" href="/assets/images/favicon.svg" />
    <link rel="apple-touch-icon-precomposed" href="/assets/images/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Vendor libraries: loaded once, before the app module, so globals
         (jQuery, gsap, Swiper, WOW, …) exist when React mounts. The per-page
         init scripts (carousel/gsapAnimation/main) run via src/agentra-init.js
         on every route change — NOT here. -->
    <script src="/assets/js/plugin/jquery.min.js"></script>
    <script src="/assets/js/plugin/bootstrap.min.js"></script>
    <script src="/assets/js/plugin/plugin.min.js"></script>
    <script src="/assets/js/plugin/swiper-bundle.min.js"></script>
    <script src="/assets/js/plugin/odometer.min.js"></script>
    <script src="/assets/js/plugin/countto.js"></script>
    <script src="/assets/js/plugin/infinityslide.js"></script>
    <script src="/assets/js/plugin/lazysize.min.js"></script>
    <script src="/assets/js/plugin/ScrollSmooth.js"></script>
    <script src="/assets/js/plugin/wow.min.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
